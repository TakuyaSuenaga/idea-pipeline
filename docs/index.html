<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Idea Pipeline Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Startup Idea Pipeline</h1>
    <p id="last-updated" class="subtitle">Loading...</p>
  </header>

  <nav class="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="saas">SaaS</button>
    <button class="filter-btn" data-filter="seo">SEO</button>
  </nav>

  <main>
    <section>
      <h2>Latest Ideas</h2>
      <div id="ideas-grid"></div>
    </section>

    <section>
      <h2>Research Sources</h2>
      <div class="table-wrap">
        <table id="research-table">
          <thead>
            <tr>
              <th>Source</th>
              <th>Title</th>
              <th>Category</th>
              <th>Score</th>
              <th>Fetched</th>
            </tr>
          </thead>
          <tbody id="research-tbody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
