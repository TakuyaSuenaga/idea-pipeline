name: Idea Evaluation Meeting

on:
  schedule:
    - cron: '0 0 * * *'  # 毎日 JST 09:00 (UTC 00:00)
  workflow_dispatch:       # 手動トリガー（テスト用）

permissions:
  contents: write          # data/ideas.db のコミット用
  issues: write            # GitHub Issue 作成用

jobs:
  run-meeting:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

      - name: Run meeting
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m meeting.main

      - name: Commit meeting log
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions"
          git add data/ideas.db docs/data/meetings.json
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: meeting run $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git fetch origin main
          git reset --soft origin/main
          git add data/ideas.db docs/data/meetings.json
          git diff --staged --quiet || git commit -m "chore: meeting run $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
